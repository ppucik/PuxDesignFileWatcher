name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PuxDesignFileWatcher.slnx

      - name: Build
        run: dotnet build PuxDesignFileWatcher.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PuxDesignFileWatcher.slnx --configuration Release --no-build --verbosity normal
